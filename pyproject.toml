[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ont-mcp"
version = "1.0.0"
description = "Talk to your fibre ONT in plain English. An MCP server for Claude, Cursor, VS Code and local models: zero dependencies, human-approved changes. Tested on Digisol."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "digisol", "ont", "gpon", "epon", "fiber", "router", "claude", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
ont-mcp = "ont_mcp:main"

[tool.setuptools]
py-modules = ["ont_mcp"]
