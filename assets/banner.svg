<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="digisol-mcp: talk to your fibre ONT in plain English">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="1" stop-color="#101A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="fibre" x1="1" x2="0">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A55"/>
      <stop offset="1" stop-color="#121A38"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8EA3FF" fill-opacity="0.10"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .flow { stroke-dasharray: 26 240; animation: flow 3.2s linear infinite; }
      .f2 { animation-delay: -0.8s; } .f3 { animation-delay: -1.6s; } .f4 { animation-delay: -2.4s; }
      @keyframes flow { from { stroke-dashoffset: 266; } to { stroke-dashoffset: 0; } }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      @media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glow2)"/>

  <!-- fibre strands entering the ONT from the right -->
  <g fill="none" stroke-linecap="round">
    <g stroke="url(#fibre)" stroke-width="2" stroke-opacity="0.35">
      <path id="p1" d="M1280 250 C1200 250 1190 292 1128 292"/>
      <path id="p2" d="M1280 310 C1210 310 1200 300 1128 300"/>
      <path id="p3" d="M1280 190 C1190 200 1200 284 1128 284"/>
      <path id="p4" d="M1280 370 C1190 360 1190 308 1128 308"/>
    </g>
    <g stroke="#E0FBFF" stroke-width="3">
      <use href="#p1" class="flow"/>
      <use href="#p2" class="flow f2"/>
      <use href="#p3" class="flow f3"/>
      <use href="#p4" class="flow f4"/>
    </g>
    <g stroke="#67E8F9" stroke-width="8" filter="url(#blur)" stroke-opacity="0.8">
      <use href="#p1" class="flow"/>
      <use href="#p3" class="flow f3"/>
    </g>
  </g>

  <!-- ONT box -->
  <g transform="translate(868 244)">
    <rect x="0" y="0" width="262" height="112" rx="16" fill="url(#box)" stroke="#3B4C8F" stroke-width="1.5"/>
    <rect x="0" y="0" width="262" height="112" rx="16" fill="none" stroke="#67E8F9" stroke-opacity="0.25" stroke-width="1"/>
    <text x="22" y="34" font-size="13" font-weight="700" fill="#8EA3D9" letter-spacing="2.5">FIBRE ONT</text>
    <!-- LEDs -->
    <g font-size="10" fill="#6B7BB0" font-weight="600" letter-spacing="1">
      <circle cx="30" cy="64" r="6" fill="#34D399" class="blink"/><circle cx="30" cy="64" r="11" fill="#34D399" opacity="0.18"/>
      <text x="19" y="92">PON</text>
      <circle cx="76" cy="64" r="6" fill="#34D399"/><circle cx="76" cy="64" r="11" fill="#34D399" opacity="0.18"/>
      <text x="64" y="92">LAN</text>
      <circle cx="122" cy="64" r="6" fill="#22D3EE" class="blink" style="animation-delay:-1.2s"/><circle cx="122" cy="64" r="11" fill="#22D3EE" opacity="0.18"/>
      <text x="111" y="92">SSH</text>
      <circle cx="168" cy="64" r="6" fill="#334155"/>
      <text x="158" y="92">LOS</text>
    </g>
    <!-- port -->
    <rect x="214" y="48" width="30" height="30" rx="6" fill="#0B1022" stroke="#3B4C8F"/>
    <circle cx="229" cy="63" r="5" fill="#67E8F9"/>
  </g>

  <!-- chat -->
  <g transform="translate(724 44)">
    <rect x="0" y="0" width="300" height="52" rx="18" fill="#1E293B" stroke="#334155"/>
    <text x="22" y="33" font-size="19" fill="#E2E8F0">Is my fibre connection up?</text>
  </g>
  <g transform="translate(830 112)">
    <rect x="0" y="0" width="380" height="96" rx="18" fill="#0E2A3A" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="22" y="32" font-size="14" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">▸ ont_show status</text>
    <text x="22" y="64" font-size="19" fill="#ECFEFF"><tspan fill="#34D399" font-weight="700">✓</tspan> Yes. WAN is up, 18 h uptime,</text>
    <text x="43" y="86" font-size="19" fill="#ECFEFF">firmware V1.0.00. All good.</text>
  </g>
  <path d="M1000 208 L1000 244" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- title -->
  <text x="80" y="168" font-size="84" font-weight="800" fill="#F8FAFC" letter-spacing="-2">digisol<tspan fill="url(#title)">-mcp</tspan></text>
  <text x="84" y="220" font-size="30" fill="#C7D2FE" font-weight="500">Talk to your fibre ONT in plain English.</text>

  <!-- chips -->
  <g font-size="16" font-weight="600">
    <g transform="translate(84 262)">
      <rect width="196" height="38" rx="19" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="98" y="25" text-anchor="middle" fill="#A5F3FC">🛡  You approve changes</text>
    </g>
    <g transform="translate(294 262)">
      <rect width="176" height="38" rx="19" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/>
      <text x="88" y="25" text-anchor="middle" fill="#E9D5FF">📦  Zero dependencies</text>
    </g>
    <g transform="translate(484 262)">
      <rect width="168" height="38" rx="19" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="84" y="25" text-anchor="middle" fill="#A7F3D0">🏡  Runs 100% local</text>
    </g>
  </g>
  <text x="86" y="352" font-size="16" fill="#7C89B8">Claude · Cursor · VS Code · LM Studio · any MCP client</text>
</svg>
