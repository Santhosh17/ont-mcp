<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="ONT MCP: your fibre box, now fluent in AI">
  <defs>
    <radialGradient id="bg" cx="0.2" cy="0.1" r="1.1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2F5"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0071E3" stop-opacity="0.07"/><stop offset="1" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E6EB"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .pulse { stroke-dasharray: 18 220; animation: pulse 2.8s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes pulse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 238; } }
      .breathe { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .breathe { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <ellipse cx="990" cy="300" rx="380" ry="260" fill="url(#halo)"/>

  <!-- copy -->
  <text x="96" y="196" font-size="19" font-weight="600" fill="#0071E3" letter-spacing="0.2">Model Context Protocol server</text>
  <text x="92" y="292" font-size="104" font-weight="700" fill="#1D1D1F" letter-spacing="-4">ONT MCP</text>
  <text x="96" y="348" font-size="32" font-weight="500" fill="#6E6E73" letter-spacing="-0.4">Your fibre box, now fluent in AI.</text>
  <text x="96" y="440" font-size="16" font-weight="500" fill="#86868B">Works with Claude, Cursor, VS Code and local models.</text>

  <!-- conversation -->
  <g filter="url(#lift)">
    <rect x="896" y="92" width="268" height="46" rx="23" fill="#0071E3"/>
    <rect x="836" y="150" width="324" height="46" rx="23" fill="#E9E9EB"/>
  </g>
  <text x="1030" y="121" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Is my fibre connection up?</text>
  <text x="998" y="179" font-size="18" fill="#1D1D1F" text-anchor="middle" letter-spacing="-0.2">Yes. WAN is up, online for 18 hours.</text>
  <text x="856" y="220" font-size="12" fill="#86868B" font-weight="500">Read with ont_show · no changes made</text>

  <!-- fibre cable -->
  <path id="fib" d="M1176 352 C1220 352 1232 316 1290 312" fill="none" stroke="#D2D2D7" stroke-width="5" stroke-linecap="round"/>
  <use href="#fib" class="pulse" fill="none" stroke="#64D2FF" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="1160" y="343" width="22" height="18" rx="4" fill="#0071E3"/>

  <!-- device -->
  <ellipse cx="1000" cy="432" rx="168" ry="9" fill="#000" opacity="0.16" filter="url(#soft)"/>
  <rect x="836" y="292" width="328" height="122" rx="26" fill="url(#dev)" stroke="#D2D2D7" stroke-width="1"/>
  <rect x="870" y="293" width="260" height="1.5" fill="url(#sheen)"/>
  <g font-size="9.5" font-weight="600" fill="#A1A1A6" letter-spacing="1.2" text-anchor="middle">
    <circle cx="884" cy="346" r="10" fill="#30D158" opacity=".16"/><circle cx="884" cy="346" r="4.5" fill="#30D158"/>
    <text x="884" y="374">PWR</text>
    <circle cx="930" cy="346" r="10" fill="#30D158" opacity=".16"/><circle cx="930" cy="346" r="4.5" fill="#30D158" class="breathe"/>
    <text x="930" y="374">PON</text>
    <circle cx="976" cy="346" r="4.5" fill="#D1D1D6"/>
    <text x="976" y="374">LOS</text>
    <circle cx="1022" cy="346" r="10" fill="#30D158" opacity=".16"/><circle cx="1022" cy="346" r="4.5" fill="#30D158" class="breathe" style="animation-delay:-1.4s"/>
    <text x="1022" y="374">LAN</text>
  </g>
  <text x="1126" y="364" font-size="14" font-weight="600" fill="#A1A1A6" letter-spacing="3.5" text-anchor="end">ONT</text>
</svg>
